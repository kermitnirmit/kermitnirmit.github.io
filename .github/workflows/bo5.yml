# Rebuilds the Best-of-fives data from Leaguepedia every day and commits whatever changed.
# Run it by hand from the Actions tab with "Run workflow".
name: Update best-of-fives

on:
  schedule:
    - cron: '17 9 * * *'  # 09:17 UTC daily: after the previous day's LCK, LPL, LEC and LCS matches
  workflow_dispatch:

permissions:
  contents: write  # to push the updated data

concurrency:
  group: bo5
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch every player with 20+ best-of-fives
        run: python3 scripts/bo5.py --min 20 --index bo5/players.json

      # Runs even if a few players failed, so the rest still get updated; the job still shows as failed.
      - name: Commit and push changes
        if: ${{ !cancelled() }}
        run: |
          git add bo5/players bo5/players.json
          if git diff --cached --quiet; then
            echo "No data changed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update best-of-fives data"
          git pull --rebase
          git push
