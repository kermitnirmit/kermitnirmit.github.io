<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pro Best-of-Fives</title>
<meta name="description" content="Every best-of-five a League of Legends pro has played, game by game, across all 20 ways a best-of-five can end.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<script>try { if (localStorage.getItem('bo5-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}</script>

<div class="wrap">
  <div class="top">
    <a class="backlink" href="/">← nirmit.dev</a>
    <span>
      <label>Made without AI. Inspired by <a href="https://roadtolarissa.com/">Adam Pearce's interactive visualizations</a>.</label>
    </span>
    <button id="bTheme" class="theme-btn" aria-pressed="false">Light mode</button>
  </div>
  <h1 id="title">Every way <span class="who-poss"><span class="pick"><input id="who" type="text" size="1" value="Faker" aria-label="Player" placeholder="Player"
    role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="whoList" autocomplete="off" autocapitalize="off" spellcheck="false"><span class="sizer" id="whoSizer" aria-hidden="true"></span></span><span id="poss">'s</span></span> best-of-fives have ended<ul class="picks" id="whoList" role="listbox" hidden></ul></h1>
  <p class="lede" id="lede">&nbsp;</p>

  <div class="filters" id="filters" role="group" aria-label="Filter by event"></div>

  <section class="hero">
    <div class="cols" id="colheads" aria-hidden="true"></div>
    <div id="lattice" class="lattice"></div>
    <div class="detail" id="detail" aria-live="polite"></div>
  </section>

  <section class="block">
    <h2>All 20 endings <small>how often each happened</small></h2>
    <div class="endings" id="endings"></div>
  </section>

  <section class="block">
    <h2>Year by year <small>one column per series, game 1 at the top</small></h2>
    <div class="years" id="years"></div>
  </section>

  <section class="block" id="leaders">
    <h2>Leaderboard <small>who wins most often from each scoreline</small></h2>
    <div class="filters" id="lbStates" role="group" aria-label="Scoreline"></div>
    <ol class="lb" id="lb"></ol>
    <p class="note" id="lbNote"></p>
  </section>

  <p class="foot" id="foot"></p>
</div>

<div class="tip" id="tip" hidden></div>

<script src="app.js?v=12"></script>
</body>
</html>
